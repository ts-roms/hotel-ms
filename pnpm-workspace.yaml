packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests/*'

allowBuilds:
  '@prisma/engines': true
  # Telemetry postinstall pulled in by swagger-ui-dist; not needed.
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  # Optional native accelerator for BullMQ; the prebuilt binary is used without a build.
  msgpackr-extract: false
  prisma: true
  # Version-check postinstall of the OpenTelemetry exporters' protobuf runtime; not needed.
  protobufjs: false
  sharp: true
  unrs-resolver: true

# Transitive dependencies of the Prisma CLI (pulled in as a peer of @prisma/client).
overrides:
  # Patched release in the same major; Prisma only loads mysql2 for MySQL datasources.
  mysql2: ^3.24.4

auditConfig:
  ignoreGhsas:
    # deepmerge-ts stack exhaustion on recursive object graphs. Only reachable through
    # @prisma/config merging our own prisma.config.ts at CLI time, never request data.
    # The fix is a new major that @prisma/config does not support yet. Re-check on each
    # Prisma upgrade.
    - GHSA-ggr8-5vv4-36mx
