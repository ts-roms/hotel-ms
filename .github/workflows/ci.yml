# Pull-request pipeline (blueprint §24): lint → typecheck → unit → integration (incl. the
# tenant-isolation suites) → build → security checks → container images.
# Deploy stages (staging → E2E → approval → production) are added with the infrastructure.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis-cache:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
      redis-queue:
        image: valkey/valkey:8-alpine
        ports: ['6380:6379']
    env:
      NODE_ENV: test
      DATABASE_OWNER_URL: postgresql://hotel_owner:hotel_owner@localhost:5432/hotel
      DATABASE_URL: postgresql://hotel_app:hotel_app@localhost:5432/hotel
      DATABASE_SYSTEM_URL: postgresql://hotel_system:hotel_system@localhost:5432/hotel
      REDIS_CACHE_URL: redis://localhost:6379
      REDIS_QUEUE_URL: redis://localhost:6380
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create database roles (Terraform does this in cloud environments)
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f infrastructure/docker/postgres-init.sql
        env:
          PGPASSWORD: postgres

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Prisma schema and migrations agree (no drift)
        working-directory: packages/database
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

      - name: Integration tests (RLS, API isolation matrix, outbox)
        run: pnpm test:integration

      - name: Seed runs cleanly
        run: pnpm db:seed

      - name: OpenAPI document is up to date
        run: |
          pnpm --filter @hotel/api openapi
          git diff --exit-code docs/api/openapi.json

      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  images:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
