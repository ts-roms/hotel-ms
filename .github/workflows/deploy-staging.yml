# Every commit on main that passes CI goes to staging.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      sha: ${{ github.event.workflow_run.head_sha }}
