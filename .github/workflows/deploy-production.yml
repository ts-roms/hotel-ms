# Promote a commit that is already running on staging. The "production" GitHub environment
# must have required reviewers configured; the job waits for approval there. The commit must
# be on main and its staging run (deploy + smoke E2E) must have succeeded (ADR-0029).
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to release (must be on main and deployed to staging)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit is on main
        run: git merge-base --is-ancestor "${{ inputs.sha }}" origin/main
      - name: Commit passed staging (deploy and smoke tests)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          passed="$(gh run list --workflow deploy-staging.yml --commit "$SHA" \
            --status success --limit 1 --json databaseId --jq 'length')"
          if [ "$passed" != "1" ]; then
            echo "::error::$SHA has no successful staging deploy and smoke run. Release it to staging first."
            exit 1
          fi

  production:
    needs: verify
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      sha: ${{ inputs.sha }}
